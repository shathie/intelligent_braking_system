model:
  name: "lstm"  # or "transformer"
  input_dim: 17  # Number of CAN signals (matches PreprocessingConfig.can_signals)
  hidden_dim: 256
  num_layers: 2
  dropout: 0.2
  seq_len: 50    # Sequence length

training:
  batch_size: 16
  learning_rate: 1e-3
  weight_decay: 0.001
  epochs: 150
  optimizer: "adam"