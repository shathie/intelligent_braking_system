# For Soft Actor-Critic
sac:
  policy: "Gaussian"
  actor_lr: 3e-4
  critic_lr: 1e-3
  gamma: 0.99
  tau: 0.005
  batch_size: 64
  buffer_size: 1000000
  ent_coef: "auto"
  device: "cuda"

# For MPC
mpc:
  horizon: 10
  dt: 0.1
  max_iter: 100
  solver: "ipopt"
  Q: [10, 1, 1, 1, 1, 1, 1, 1, 1, 1]  # State cost weights
  R: [0.1]  # Control cost weight

training:
  epochs: 150
  episodes_per_epoch: 30    # More episodes per epoch for better policy estimation
  max_steps: 2500           # 25 s at dt=0.01 s — covers icy-surface stopping time